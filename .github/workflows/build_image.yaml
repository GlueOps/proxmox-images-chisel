name: Packer build qemu

on:
  release:
    # release-please publishes semver releases as prereleases; this build
    # attaches the image assets and then flips the release to full + latest,
    # so releases/latest/download always serves a release that has the image.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build for and attach assets to (e.g. v0.1.0)'
        required: true
      chisel_image:
        description: 'Chisel docker image to preload'
        required: false
        default: 'docker.io/jpillora/chisel:1'

permissions:
  contents: write

env:
  IMAGE_NAME: debian-13-chisel-amd64

jobs:
  build:
    # Ignore re-publish events for releases the build itself edits (prerelease -> full)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHISEL_IMAGE: ${{ inputs.chisel_image || 'docker.io/jpillora/chisel:1' }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Enable KVM group perms
        run: |
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        id: setup
        with:
          version: 1.11.2

      - name: Generate image password
        run: echo "IMAGE_PASSWORD=$(openssl rand -base64 16)" >> $GITHUB_ENV

      - name: Generate cloud-init data
        run: |
          echo '#cloud-config
          chpasswd:
            expire: False
            users:
            - {name: debian, password: '"$IMAGE_PASSWORD"', type: text}
          ssh_pwauth: True' > user-data
          echo '' > meta-data

      - name: Install runner dependencies
        run: sudo apt-get update && sudo apt-get install qemu-system genisoimage qemu-utils -y

      - name: Run packer init
        id: init
        run: packer init qemu.pkr.hcl

      - name: Run packer build
        id: build
        run: packer build -var chisel_image=${{ env.CHISEL_IMAGE }} -var image_password=${{ env.IMAGE_PASSWORD }} qemu.pkr.hcl
        env:
          PACKER_LOG: 1

      - name: Verify size fits a GitHub release asset
        run: |
          qemu-img info "images/${IMAGE_NAME}.qcow2"
          ls -lh "images/${IMAGE_NAME}.qcow2"
          # GitHub release assets are capped at 2 GiB per file — fail loudly if we ever outgrow it
          test "$(stat -c%s "images/${IMAGE_NAME}.qcow2")" -lt 2000000000

      - name: Generate checksums
        run: |
          mv "images/${IMAGE_NAME}.qcow2" .
          sha256sum "${IMAGE_NAME}.qcow2" > SHA256SUMS

      - name: Upload assets and promote release to latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "${IMAGE_NAME}.qcow2" SHA256SUMS --clobber
          gh release edit "$TAG" --prerelease=false --latest
