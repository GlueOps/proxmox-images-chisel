name: Packer build qemu

on:
  workflow_dispatch:
    inputs:
      chisel_image:
        description: 'Chisel docker image to preload'
        required: false
        default: 'docker.io/jpillora/chisel:1'
  schedule:
    # Weekly rebuild picks up Debian point releases and security updates
    - cron: '0 6 * * 1'

permissions:
  contents: write

env:
  IMAGE_NAME: debian-13-chisel-amd64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHISEL_IMAGE: ${{ inputs.chisel_image || 'docker.io/jpillora/chisel:1' }}
    steps:
      - name: Enable KVM group perms
        run: |
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        id: setup
        with:
          version: 1.11.2

      - name: Generate image password
        run: echo "IMAGE_PASSWORD=$(openssl rand -base64 16)" >> $GITHUB_ENV

      - name: Generate cloud-init data
        run: |
          echo '#cloud-config
          chpasswd:
            expire: False
            users:
            - {name: debian, password: '"$IMAGE_PASSWORD"', type: text}
          ssh_pwauth: True' > user-data
          echo '' > meta-data

      - name: Install runner dependencies
        run: sudo apt-get update && sudo apt-get install qemu-system genisoimage qemu-utils -y

      - name: Run packer init
        id: init
        run: packer init qemu.pkr.hcl

      - name: Run packer build
        id: build
        run: packer build -var chisel_image=${{ env.CHISEL_IMAGE }} -var image_password=${{ env.IMAGE_PASSWORD }} qemu.pkr.hcl
        env:
          PACKER_LOG: 1

      - name: Verify size fits a GitHub release asset
        run: |
          qemu-img info "images/${IMAGE_NAME}.qcow2"
          ls -lh "images/${IMAGE_NAME}.qcow2"
          # GitHub release assets are capped at 2 GiB per file — fail loudly if we ever outgrow it
          test "$(stat -c%s "images/${IMAGE_NAME}.qcow2")" -lt 2000000000

      - name: Generate checksums
        run: |
          mv "images/${IMAGE_NAME}.qcow2" .
          sha256sum "${IMAGE_NAME}.qcow2" > SHA256SUMS

      - name: Create GitHub release with image asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d.%H%M)"
          gh release create "$TAG" --latest --title "$TAG" --notes "Minimal Proxmox VM image for GlueOps chisel exit nodes (dev/k3d load balancers).

          - Base: debian-13-genericcloud-amd64 (trixie/latest at build time, checksum-verified by packer)
          - Baked in: qemu-guest-agent (enabled), docker engine (enabled), pre-pulled ${CHISEL_IMAGE}
          - Provisioners only need a cloud-init runcmd like: docker run -d --restart always -p 9090:9090 -p 443:443 -p 80:80 ${CHISEL_IMAGE} server --reverse --port=9090 --auth='<user>:<pass>'
          - Instance identity reset at build (cloud-init clean, ssh host keys removed, machine-id cleared, build password locked)

          Stable download URL: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${IMAGE_NAME}.qcow2" \
            "${IMAGE_NAME}.qcow2" SHA256SUMS
